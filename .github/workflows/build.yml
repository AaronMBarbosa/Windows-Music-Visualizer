name: Private Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate and package
        shell: pwsh
        run: ./scripts/Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsMusicVisualizer-1.0.0-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 14
